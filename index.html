<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>समाचार भारती — ताज़ा हिंदी ख़बरें</title>
  <meta name="description" content="देश, दुनिया, खेल, व्यापार, मनोरंजन और टेक्नोलॉजी की ताज़ा हिंदी ख़बरें।">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <div class="container topbar-inner">
      <span id="today"></span>
      <button id="themeToggle" class="theme-toggle" aria-label="थीम बदलें">🌙</button>
    </div>
  </div>

  <header class="site-header">
    <div class="container header-inner">
      <a href="#/" class="logo">समाचार<span>भारती</span></a>
      <form id="searchForm" class="search" role="search">
        <input id="searchInput" type="search" placeholder="ख़बरें खोजें…" aria-label="ख़बरें खोजें">
        <button type="submit" aria-label="खोजें">🔍</button>
      </form>
      <button id="menuToggle" class="menu-toggle" aria-label="मेनू" aria-expanded="false">☰</button>
    </div>
    <nav class="main-nav" id="mainNav">
      <div class="container"><ul id="navList"></ul></div>
    </nav>
  </header>

  <div class="ticker">
    <div class="container ticker-inner">
      <span class="ticker-label">ब्रेकिंग</span>
      <div class="ticker-track"><div class="ticker-content" id="tickerContent"></div></div>
    </div>
  </div>

  <main id="app" class="container" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <a href="#/" class="logo logo-light">समाचार<span>भारती</span></a>
        <p>सच्ची, तेज़ और निष्पक्ष ख़बरें — आपकी अपनी भाषा में।</p>
      </div>
      <div>
        <h4>श्रेणियाँ</h4>
        <ul id="footerCats"></ul>
      </div>
      <div>
        <h4>न्यूज़लेटर</h4>
        <form id="newsletterForm" class="newsletter">
          <input type="email" required placeholder="आपका ईमेल" aria-label="ईमेल">
          <button type="submit">सब्सक्राइब</button>
        </form>
        <p id="newsletterMsg" class="small"></p>
      </div>
    </div>
    <div class="container copyright">© <span id="year"></span> समाचार भारती। सर्वाधिकार सुरक्षित।</div>
  </footer>

  <button id="backToTop" class="back-to-top" aria-label="ऊपर जाएँ">↑</button>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
