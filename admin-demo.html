<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>समाचार भारती एडमिन</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Mukta:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3f3; --surface:#ffffff; --surface-2:#f8f7f7; --ink:#1c1b1d; --muted:#6b6770; --faint:#9b97a0; --line:#e6e3e4;
  --red:#d71920; --red-soft:#fdecec; --red-ink:#b3141b; --on-red:#ffffff;
  --side:#17161a; --side-ink:#d9d6dc; --side-muted:#8d8893; --side-hover:#25232a;
  --good:#1e7d45; --good-soft:#e6f4ec; --warn:#a4640b; --warn-soft:#fbf1e1; --info:#2360a5; --info-soft:#e7eff9; --bad:#b3141b; --bad-soft:#fdecec;
  --shadow:0 1px 2px rgba(23,22,26,.05),0 8px 24px rgba(23,22,26,.07);
  --f-ui:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;
  --f-body:"Noto Sans Devanagari","Mukta",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111013; --surface:#1b1a1e; --surface-2:#222126; --ink:#ecebee; --muted:#a7a2ad; --faint:#77727d; --line:#2e2c33;
    --red:#ef3a41; --red-soft:#3a1719; --red-ink:#ff7076; --on-red:#ffffff;
    --side:#0b0a0d; --side-ink:#d9d6dc; --side-muted:#8d8893; --side-hover:#1d1b21;
    --good:#4cc47f; --good-soft:#15291e; --warn:#e5a54b; --warn-soft:#2e2211; --info:#6aa6ec; --info-soft:#15233a; --bad:#ff7076; --bad-soft:#3a1719;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111013; --surface:#1b1a1e; --surface-2:#222126; --ink:#ecebee; --muted:#a7a2ad; --faint:#77727d; --line:#2e2c33;
  --red:#ef3a41; --red-soft:#3a1719; --red-ink:#ff7076; --on-red:#ffffff;
  --side:#0b0a0d; --side-ink:#d9d6dc; --side-muted:#8d8893; --side-hover:#1d1b21;
  --good:#4cc47f; --good-soft:#15291e; --warn:#e5a54b; --warn-soft:#2e2211; --info:#6aa6ec; --info-soft:#15233a; --bad:#ff7076; --bad-soft:#3a1719;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.brand{display:flex;align-items:center;gap:0;padding:18px 18px 14px;font-weight:800;font-size:20px;line-height:1}
.brand .a{background:var(--red);color:#fff;padding:6px 8px 4px;border-radius:3px 0 0 3px}
.brand .b{border:2px solid var(--red);border-left:0;color:#fff;padding:4px 8px 2px;border-radius:0 3px 3px 0}
.brand small{display:block;font-size:11px;font-weight:600;letter-spacing:1.4px;color:var(--side-muted);margin-left:10px;text-transform:uppercase}
.navgroup{padding:10px 10px 4px}
.navgroup h6{margin:6px 10px 6px;font-size:11px;letter-spacing:1.2px;color:var(--side-muted);text-transform:uppercase;font-weight:700}
.navitem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--side-ink);padding:8px 10px;border-radius:6px;text-align:left;font-size:15px;font-weight:500}
.navitem:hover{background:var(--side-hover)}
.navitem[aria-current="page"]{background:var(--red);color:#fff}
.navitem .count{margin-left:auto;background:#ffffff1f;color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:0 7px;font-variant-numeric:tabular-nums}
.navitem[aria-current="page"] .count{background:#ffffff33}
.side-foot{margin-top:auto;padding:14px 18px 18px;font-size:12.5px;color:var(--side-muted);border-top:1px solid #ffffff12}
.side-foot button{border:0;background:none;color:var(--side-ink);padding:0;text-decoration:underline;text-underline-offset:3px}

.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.icon-btn.menu-btn{display:none}
.gsearch{flex:1;max-width:460px;display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:0 10px}
.gsearch input{border:0;background:transparent;flex:1;min-width:0;padding:8px 0;outline:none}
.gsearch:focus-within{border-color:var(--red)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{position:relative;border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:8px;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{border-color:var(--faint)}
.dot{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 3px}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;flex:none}
.me b{display:block;font-size:14px;line-height:1.2}.me span{font-size:12px;color:var(--muted)}
.content{padding:22px 24px 48px;min-width:0}

/* generic */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{margin:0;font-size:26px;font-weight:800;line-height:1.2}
.page-head p{margin:2px 0 0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:7px;font-weight:600;font-size:14.5px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.primary:hover{background:var(--red-ink);border-color:var(--red-ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:3px 10px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h h2{margin:0;font-size:17px;font-weight:700}
.card-b{padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;border-radius:999px;padding:1px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-published,.p-approved,.p-active{background:var(--good-soft);color:var(--good)}
.p-draft,.p-pending{background:var(--warn-soft);color:var(--warn)}
.p-scheduled{background:var(--info-soft);color:var(--info)}
.p-spam,.p-inactive,.p-expired{background:var(--bad-soft);color:var(--bad)}
.flag{font-size:11.5px;font-weight:800;padding:0 6px;border-radius:3px;letter-spacing:.3px}
.flag.brk{background:var(--red);color:#fff}.flag.feat{background:var(--ink);color:var(--surface)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stat{padding:14px 16px;display:grid;gap:2px}
.stat .lbl{font-size:13.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.stat .num{font-size:30px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .sub{font-size:12.5px;color:var(--muted)}
.stat .sub b{color:var(--good)}
.dash{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.dash .span{grid-column:1/-1}
@media (max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.dash{grid-template-columns:1fr}}

.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:12px;font-family:var(--f-ui)}
.chart .bar{fill:var(--red)}
.chart .bar.today{fill:var(--red-ink)}
.chart .hit{fill:transparent}
.chart .hit:hover+.bar,.chart .bar:hover{opacity:.85}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:13px;padding:5px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);font-variant-numeric:tabular-nums}
.hbars{display:grid;gap:10px}
.hbar{display:grid;grid-template-columns:92px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:14px}
.hbar .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.hbar .fill{height:100%;background:var(--red);border-radius:5px}
.hbar .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.mini-list{list-style:none;margin:0;padding:0}
.mini-list li{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-top:1px solid var(--line)}
.mini-list li:first-child{border-top:0}
.mini-list .t{flex:1;min-width:0}
.mini-list .t b{display:block;font-weight:600;font-family:var(--f-body);font-size:14px;line-height:1.45}
.linkish{border:0;background:none;padding:0;text-align:left;font-weight:600;font-family:var(--f-body);font-size:14px;line-height:1.45;color:var(--ink)}
.linkish:hover{color:var(--red)}
.log li{font-size:13.5px}
.log time{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* toolbar + table */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.field-inline{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:0 10px}
.field-inline input{border:0;outline:0;background:transparent;padding:6px 0;min-width:0;width:200px}
.field-inline:focus-within{border-color:var(--red)}
select.sel{border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:6px 8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);padding:4px 12px;border-radius:999px;font-size:13.5px;font-weight:600}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.bulk{display:flex;gap:6px;align-items:center;margin-left:auto;font-size:13.5px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.3px;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
th.num{text-align:right}
.tcell{display:flex;gap:10px;align-items:center;min-width:280px}
.thumb{width:64px;height:40px;border-radius:5px;flex:none;object-fit:cover;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;background:var(--c,#888)}
.ttl{font-family:var(--f-body);font-weight:600;font-size:14px;line-height:1.45}
.ttl-meta{display:flex;gap:6px;align-items:center;margin-top:2px;font-size:12px;color:var(--muted)}
.row-acts{display:flex;gap:2px;justify-content:flex-end}
.row-acts button{border:0;background:none;width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.row-acts button:hover{background:var(--surface-2);color:var(--ink)}
.row-acts button.del:hover{color:var(--bad);background:var(--bad-soft)}
.swatch{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.pager .pg{display:flex;gap:4px}
.pager .pg button{border:1px solid var(--line);background:var(--surface);min-width:32px;height:30px;border-radius:6px;font-weight:600;font-variant-numeric:tabular-nums}
.pager .pg button[aria-current="true"]{background:var(--red);border-color:var(--red);color:#fff}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--red)}

/* forms */
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:1100px){.form-grid{grid-template-columns:1fr}}
.fld{display:grid;gap:5px}
.fld>label,.lbl2{font-size:13.5px;font-weight:700}
.fld .hint{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.hint .over{color:var(--bad);font-weight:700}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;outline:none}
.inp:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
textarea.inp{resize:vertical;min-height:70px;font-family:var(--f-body)}
.inp.title{font-family:var(--f-body);font-size:22px;font-weight:700;padding:10px 12px}
.err{color:var(--bad);font-size:12.5px;font-weight:600}
.inp.bad{border-color:var(--bad)}
.stack{display:grid;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.editor{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.editor:focus-within{border-color:var(--red)}
.etools{display:flex;gap:2px;flex-wrap:wrap;padding:6px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.etools button{border:0;background:none;min-width:32px;height:30px;border-radius:5px;font-weight:700;padding:0 8px;font-size:14px}
.etools button:hover{background:var(--surface)}
.etools .sep{width:1px;background:var(--line);margin:4px 4px}
.earea{min-height:260px;padding:14px 16px;outline:none;font-family:var(--f-body);font-size:16.5px;line-height:1.85}
.earea:empty::before{content:attr(data-ph);color:var(--faint)}
.earea h2{font-size:20px;margin:10px 0 6px}
.earea blockquote{border-left:3px solid var(--red);margin:10px 0;padding:2px 12px;color:var(--muted)}
.wc{padding:6px 12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.toggle span{font-size:14px;font-weight:600}
.toggle small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.sw{position:relative;width:40px;height:22px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;width:100%;height:100%}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:11px;transition:.15s;pointer-events:none}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px #0003}
.sw input:checked+i{background:var(--good)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:2px solid var(--red);outline-offset:2px}
.radios{display:grid;gap:6px}
.radio{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:7px;padding:7px 10px;cursor:pointer}
.radio:has(input:checked){border-color:var(--red);background:var(--red-soft)}
.radio input{accent-color:var(--red)}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--muted);cursor:pointer;display:grid;gap:4px;place-items:center;background:var(--surface-2);position:relative}
.drop:hover,.drop.over{border-color:var(--red);color:var(--ink)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.preview-img{position:relative;border-radius:8px;overflow:hidden}
.preview-img img{display:block;width:100%;max-width:100%;aspect-ratio:16/9;object-fit:cover}
.preview-img button{position:absolute;top:8px;right:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);border-radius:7px;padding:5px 6px;background:var(--surface)}
.chips:focus-within{border-color:var(--red)}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:1px 4px 1px 10px;font-size:13.5px}
.chip button{border:0;background:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--muted);padding:0}
.chips input{border:0;outline:0;background:transparent;flex:1;min-width:120px;padding:3px 4px}
.sticky-actions{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:16px;border-radius:0 0 10px 10px}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.media{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.media img{display:block;width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover}
.media .cap{padding:6px 8px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;align-items:center}
.imgs-mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.imgs-mini div{position:relative}
.imgs-mini img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:5px;display:block}
.imgs-mini button{position:absolute;top:2px;right:2px;border:0;background:#000a;color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px;line-height:1;padding:0}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,9,12,.5);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;width:min(620px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal.wide{width:min(860px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:18px}
.modal-b{padding:18px;overflow-y:auto}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.toast-wrap{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:70}
.toast{background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;font-size:14px;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;max-width:340px}
.toast.bad{background:var(--bad);color:#fff}
.demo-note{background:var(--warn-soft);color:var(--warn);font-size:13px;padding:6px 12px;border-radius:8px;margin-bottom:16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.demo-note button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:0}

/* article preview */
.apv h1{font-family:var(--f-body);font-size:26px;line-height:1.35;margin:6px 0 8px}
.apv .dek{color:var(--muted);border-left:3px solid var(--red);padding-left:10px;font-family:var(--f-body)}
.apv .body{font-family:var(--f-body);font-size:16.5px;line-height:1.85}
.apv img{width:100%;max-width:100%;border-radius:8px;aspect-ratio:16/9;object-fit:cover}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:
  linear-gradient(135deg,color-mix(in srgb,var(--red) 10%,var(--bg)),var(--bg) 60%)}
.login .card{width:min(400px,100%);padding:26px}
.login h1{margin:14px 0 4px;font-size:24px}
.login .brand{padding:0;color:var(--ink)}.login .brand .b{color:var(--red)}
.creds{background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--muted);margin-top:14px}
.creds b{color:var(--ink);font-variant-numeric:tabular-nums}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:60;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none;box-shadow:var(--shadow)}
  .icon-btn.menu-btn{display:grid}
  .topbar{padding-inline:16px}
  .content{padding-inline:16px}
  .me div{display:none}.me{padding:3px}
  .field-inline input{width:140px}
}
@media (max-width:560px){.gsearch{display:none}.stats{grid-template-columns:1fr 1fr}.stat .num{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* इमेज: छोटा करके data URL */
function readImage(file,max=1000){
  return new Promise((res,rej)=>{
    if(!file||!file.type.startsWith("image/"))return rej(new Error("सिर्फ़ इमेज फ़ाइल (JPG, PNG, WebP) चुनें।"));
    const fr=new FileReader();fr.onerror=()=>rej(new Error("फ़ाइल पढ़ी नहीं जा सकी।"));
    fr.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.78))};img.onerror=()=>rej(new Error("इमेज खुल नहीं सकी।"));img.src=fr.result};
    fr.readAsDataURL(file);
  });
}

function barChart(values){
  const W=640,Hh=220,pl=44,pr=8,pt=14,pb=28, max=Math.ceil(Math.max(...values)/10000)*10000;
  const iw=W-pl-pr, ih=Hh-pt-pb, bw=iw/values.length, gap=Math.min(22,bw*.35);
  const days=values.map((_,i)=>{const d=new Date(Date.now()-(values.length-1-i)*864e5);return i===values.length-1?"आज":d.toLocaleDateString("hi-IN",{weekday:"short"})});
  let g="";for(let k=0;k<=4;k++){const v=max*k/4,y=pt+ih-ih*k/4;g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="axis" x="${pl-8}" y="${y+4}" text-anchor="end">${v>=1000?(v/1000)+"k":v}</text>`}
  const bars=values.map((v,i)=>{const h=ih*v/max,x=pl+i*bw+gap/2,w=bw-gap,y=pt+ih-h,r=Math.min(4,w/2);
    return `<rect class="hit" x="${pl+i*bw}" y="${pt}" width="${bw}" height="${ih}" data-tip="${days[i]}: ${nf(v)} व्यूज़" data-x="${x+w/2}" data-y="${y}"/><path class="bar${i===values.length-1?" today":""}" pointer-events="none" d="M${x},${pt+ih}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${pt+ih}Z"/><text class="axis" x="${x+w/2}" y="${Hh-8}" text-anchor="middle">${days[i]}</text>`}).join("");
  return `<div class="chart" id="viewsChart"><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="पिछले 7 दिनों के पेज व्यूज़">${g}${bars}</svg><div class="tip" hidden></div></div>`;
}

function readEditor(){
  const a=draft, v=id=>$("#"+id)?.value??"";
  a.title=v("f_title").trim();a.slug=slugify(v("f_slug")||a.title);a.summary=v("f_summary").trim();
  a.content=$("#f_content").innerHTML.trim();if(!stripHtml(a.content).trim())a.content="";
  a.category=v("f_category");a.city=v("f_city");a.caption=v("f_caption").trim();a.video=v("f_video").trim();
  a.seoTitle=v("f_seoTitle").trim();a.seoDesc=v("f_seoDesc").trim();
  if(!$("#f_author").disabled)a.authorId=+v("f_author");
  const st=document.querySelector('input[name=status]:checked');if(st)a.status=st.value;
  const d=v("f_date");if(d)a.date=new Date(d).toISOString();
  ["breaking","featured","comments"].forEach(k=>a[k]=$("#f_"+k).checked);
}
function saveArticle(forceStatus){
  readEditor();const a=draft;if(forceStatus)a.status=forceStatus;
  errors={};
  if(!a.title)errors.title="शीर्षक लिखना ज़रूरी है।";
  if(!a.category)errors.category="श्रेणी चुनें।";
  if(a.status!=="draft"&&!a.content)errors.content="प्रकाशित करने से पहले ख़बर लिखें।";
  if(a.status==="scheduled"&&new Date(a.date)<=Date.now())errors.date="शेड्यूल का समय आने वाला होना चाहिए।";
  if(Object.keys(errors).length){render();toast("कुछ ज़रूरी जानकारी छूट गई है। लाल निशान वाले खाने भरें।","bad");return}
  if(a.status==="published"&&new Date(a.date)>Date.now())a.date=new Date().toISOString();
  const isNew=!a.id;
  if(isNew){a.id=nextId(db.articles);db.articles.push(a)}else{const i=db.articles.findIndex(x=>x.id===a.id);db.articles[i]=a}
  if(a.breaking&&!db.breaking.some(b=>b.articleId===a.id)){db.breaking.push({id:nextId(db.breaking),text:a.title,articleId:a.id,active:true,expires:new Date(Date.now()+12*H).toISOString(),order:db.breaking.length+1})}
  const verb=a.status==="published"?(isNew?"प्रकाशित की":"अपडेट की"):a.status==="scheduled"?"शेड्यूल की":"ड्राफ़्ट में सेव की";
  logAct(`“${short(a.title,40)}” ख़बर ${verb}`);save();
  toast(`ख़बर ${verb} गई।`);
  draft=null;errors={};go("articles");
}

  </tbody></table></div>`:`<div class="empty">${q?"कोई नतीजा नहीं मिला।":`अभी कोई ${E.one} नहीं है। “${E.one} जोड़ें” दबाएँ।`}</div>`}

let formTmp={};
function fieldHtml(f,val,err){
  const id="e_"+f.k, req=f.req?" *":"", e=err?`<span class="err">${err}</span>`:"";
  const hint=f.hint||f.max?`<div class="hint"><span>${f.hint||""}</span>${f.max?`<span>${String(val||"").length}/${f.max}</span>`:""}</div>`:"";
  switch(f.t){
    case "textarea":return `<div class="fld"><label for="${id}">${f.l}${req}</label><textarea id="${id}" class="inp ${err?"bad":""}" rows="3" ${f.max?`maxlength="${f.max}"`:""}>${esc(val)}</textarea>${hint}${e}</div>`;
    case "select":return `<div class="fld"><label for="${id}">${f.l}${req}</label><select id="${id}" class="inp">${f.opts().map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(val)?"selected":""}>${esc(l)}</option>`).join("")}</select>${e}</div>`;
    case "toggle":return `<label class="toggle"><span>${f.l}</span><span class="sw"><input type="checkbox" id="${id}" ${val?"checked":""}><i></i></span></label>`;
    case "color":return `<div class="fld"><label for="${id}">${f.l}</label><input type="color" id="${id}" class="inp" style="height:40px;padding:3px" value="${esc(val||"#d71920")}"></div>`;
    case "datetime":return `<div class="fld"><label for="${id}">${f.l}${req}</label><input type="datetime-local" id="${id}" class="inp ${err?"bad":""}" value="${val?toLocalInput(val):""}">${e}</div>`;
    case "date":return `<div class="fld"><label for="${id}">${f.l}${req}</label><input type="date" id="${id}" class="inp ${err?"bad":""}" value="${esc(val||"")}">${e}</div>`;
    case "image":formTmp[f.k]=val||"";return `<div class="fld"><span class="lbl2">${f.l}</span><div id="${id}_box">${imgBox(f.k)}</div></div>`;
    case "images":formTmp[f.k]=(val||[]).slice();return `<div class="fld"><span class="lbl2">${f.l}</span><div id="${id}_box">${imgsBox(f.k)}</div></div>`;
    default:return `<div class="fld"><label for="${id}">${f.l}${req}</label><input type="${f.t}" id="${id}" class="inp ${err?"bad":""}" value="${esc(val??"")}" placeholder="${esc(f.ph||"")}">${hint}${e}</div>`;
  }
}
const imgBox=k=>formTmp[k]?`<div class="preview-img"><img src="${formTmp[k]}" alt=""><button type="button" class="btn sm" data-rm-tmp="${k}">${ic("trash")}हटाएँ</button></div>`:`<label class="drop">${ic("upload")}<b>इमेज चुनें</b><input type="file" accept="image/*" data-up-tmp="${k}"></label>`;
const imgsBox=k=>`<div class="stack"><label class="drop">${ic("upload")}<b>एक या ज़्यादा तस्वीरें चुनें</b><span class="small">${formTmp[k].length} तस्वीरें जोड़ी गईं</span><input type="file" accept="image/*" multiple data-up-tmps="${k}"></label>${formTmp[k].length?`<div class="imgs-mini">${formTmp[k].map((s,i)=>`<div><img src="${s}" alt=""><button type="button" data-rm-tmps="${k}:${i}" aria-label="हटाएँ">×</button></div>`).join("")}</div>`:""}</div>`;
function entityForm(key,id,errs={},pending){
  const E=ENT[key], orig=id?db[E.col].find(x=>x.id===id):null, x=pending||(orig?{...orig}:{...E.defaults()});
  formTmp={};
  modal({title:(orig?E.one+" एडिट करें":"नई "+E.one).replace("नई वीडियो","नया वीडियो").replace("नई विज्ञापन","नया विज्ञापन").replace("नई यूज़र","नया यूज़र").replace("नई शहर","नया शहर"),
    body:`<form id="entForm" class="stack" novalidate>${E.fields.map(f=>fieldHtml(f,x[f.k],errs[f.k])).join("")}</form>`,
    foot:`<button class="btn" data-close>रद्द करें</button><button class="btn primary" id="entSave">सेव करें</button>`,
    onMount:o=>{
      o.querySelector("#entSave").onclick=()=>{
        const v={...x};const e={};
        E.fields.forEach(f=>{const el=o.querySelector("#e_"+f.k);
          if(f.t==="toggle")v[f.k]=el.checked;else if(f.t==="image"||f.t==="images")v[f.k]=formTmp[f.k];
          else if(f.t==="datetime")v[f.k]=el.value?new Date(el.value).toISOString():"";else v[f.k]=f.num?+el.value:el.value.trim();
          if(f.req&&!v[f.k])e[f.k]="यह खाना भरना ज़रूरी है।";});
        if(key==="cats"&&!v.slug)v.slug=slugify(v.name);
        if(key==="cats"&&db.cats.some(c=>c.slug===v.slug&&c.id!==orig?.id))e.slug="यह स्लग पहले से इस्तेमाल हो रहा है।";
        if(key==="cats"&&orig&&orig.slug!==v.slug)db.articles.forEach(a=>{if(a.category===orig.slug)a.category=v.slug});
        if(key==="cities"&&orig&&orig.name!==v.name)db.articles.forEach(a=>{if(a.city===orig.name)a.city=v.name});
        const ve=E.validate&&E.validate(v,orig);if(ve)Object.assign(e,ve);
        if(Object.keys(e).length){entityForm(key,id,e,v);return}
        if(orig)Object.assign(orig,v);else{v.id=nextId(db[E.col]);if(E.sortable)v.order=db[E.col].length+1;db[E.col].push(v)}
        logAct(`${E.one}: “${short(v.name||v.title||v.text,40)}” ${orig?"अपडेट":"नया जोड़ा"}`);save();closeModal();render();toast("बदलाव सेव हो गए।");
      };
    }});
}

  if(session.out){root.innerHTML=loginPage(session.err);return}
  const fn=PAGES[S.page]||(ENT[S.page]?()=>pageEntity(S.page):pageDashboard);
  root.innerHTML=shell(fn());
  if(S.page==="editor")bindEditor();
}

/* एडिटर के इवेंट */
function bindEditor(){
  const upd=(id,max)=>{const el=$("#"+id),c=$("#c_"+id.slice(2));if(el&&c)c.innerHTML=`<span class="${el.value.length>max?"over":""}">${el.value.length}/${max}</span>`};
  $("#f_title").addEventListener("input",e=>{upd("f_title",100);if(!draft.id&&!$("#f_slug").dataset.touched){$("#f_slug").value=slugify(e.target.value)}$("#slugPrev").textContent=$("#f_slug").value||"…"});
  $("#f_slug").addEventListener("input",e=>{e.target.dataset.touched=1;$("#slugPrev").textContent=slugify(e.target.value)||"…"});
  $("#f_summary").addEventListener("input",()=>upd("f_summary",200));
  $("#f_seoTitle").addEventListener("input",()=>upd("f_seoTitle",60));
  $("#f_seoDesc").addEventListener("input",()=>upd("f_seoDesc",160));
  const ce=$("#f_content");
  ce.addEventListener("input",()=>{const w=ce.textContent.trim().split(/\s+/).filter(Boolean).length;$("#wc").textContent=`${w} शब्द · लगभग ${Math.max(1,Math.round(w/200))} मिनट`});
  document.querySelectorAll("input[name=status]").forEach(r=>r.addEventListener("change",()=>{readEditor();render()}));
  $("#f_category").addEventListener("change",()=>{readEditor();render()});
  const tagIn=$("#tagIn");
  tagIn.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===",")&&tagIn.value.trim()){e.preventDefault();readEditor();const t=tagIn.value.trim().replace(/^#/,"");if(!draft.tags.includes(t))draft.tags.push(t);render();$("#tagIn").focus()}else if(e.key==="Backspace"&&!tagIn.value&&draft.tags.length){readEditor();draft.tags.pop();render();$("#tagIn").focus()}});
  const fi=$("#f_image");
  if(fi){const drop=$("#drop");
    const take=async file=>{try{readEditor();draft.image=await readImage(file);addMedia(draft.image,file.name);save();render();toast("तस्वीर जोड़ दी गई।")}catch(err){toast(err.message,"bad")}};
    fi.addEventListener("change",()=>fi.files[0]&&take(fi.files[0]));
    ["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over")}));
    ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,()=>drop.classList.remove("over")));
    drop.addEventListener("drop",e=>{e.preventDefault();const f=e.dataTransfer.files[0];f&&take(f)});
  }
}

/* ============ क्लिक (एक जगह से) ============ */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-go],label.drop,a");if(!t)return;
  const d=t.dataset;
  if(d.go){if(d.go==="editor"&&(d.new||t.classList.contains("navitem"))){draft=null;errors={};S.editId=null}if(d.sortviews)S.sort="views";if(d.go!==S.page)S.eq="";go(d.go);return}
  if(d.edit){draft=null;errors={};go("editor",{editId:+d.edit});return}
  if(d.preview){previewArticle(art(+d.preview));return}
  if(d.dup){const a=JSON.parse(JSON.stringify(art(+d.dup)));a.id=nextId(db.articles);a.title+=" (कॉपी)";a.slug=slugify(a.title);a.status="draft";a.views=0;a.date=new Date().toISOString();a.breaking=false;db.articles.push(a);logAct(`“${short(a.title,40)}” की कॉपी बनाई`);save();render();toast("ड्राफ़्ट के रूप में कॉपी बन गई।");return}
  if(d.delart){const a=art(+d.delart);confirmBox(`“${esc(short(a.title,70))}” ख़बर हमेशा के लिए हट जाएगी।`,()=>{db.articles=db.articles.filter(x=>x.id!==a.id);db.breaking=db.breaking.filter(b=>b.articleId!==a.id);S.sel.delete(a.id);logAct(`“${short(a.title,40)}” ख़बर हटाई`);save();draft=null;if(S.page==="editor")go("articles");else render();toast("ख़बर हटा दी गई।")});return}
  if(d.fstatus!==undefined){S.fstatus=d.fstatus;S.pg=1;render();return}
  if(d.pg){S.pg=+d.pg;render();return}
  if(d.bulk){const ids=[...S.sel];if(d.bulk==="delete"){confirmBox(`${ids.length} ख़बरें हमेशा के लिए हट जाएँगी।`,()=>{db.articles=db.articles.filter(a=>!S.sel.has(a.id));logAct(`${ids.length} ख़बरें एक साथ हटाईं`);S.sel.clear();save();render();toast("ख़बरें हटा दी गईं।")})}else{if(me().role==="reporter"&&d.bulk==="published")return toast("रिपोर्टर ख़बरें प्रकाशित नहीं कर सकते।","bad");db.articles.forEach(a=>{if(S.sel.has(a.id)){a.status=d.bulk;if(d.bulk==="published"&&new Date(a.date)>Date.now())a.date=new Date().toISOString()}});logAct(`${ids.length} ख़बरें “${STATUS[d.bulk]}” कीं`);S.sel.clear();save();render();toast(`${ids.length} ख़बरें ${STATUS[d.bulk]} हो गईं।`)}return}
  if(d.cmt){const c=db.comments.find(x=>x.id===+d.id);if(d.cmt==="delete"){confirmBox("यह टिप्पणी हमेशा के लिए हट जाएगी।",()=>{db.comments=db.comments.filter(x=>x!==c);save();render();toast("टिप्पणी हटा दी गई।")});return}c.status=d.cmt;logAct(`${c.name} की टिप्पणी ${d.cmt==="approved"?"मंज़ूर":"स्पैम"} की`);save();render();toast(d.cmt==="approved"?"टिप्पणी मंज़ूर हो गई।":"टिप्पणी स्पैम में डाल दी गई।");return}
  if(d.cstatus!==undefined){S.cstatus=d.cstatus;render();return}
  if(d.newEnt){entityForm(d.newEnt);return}
  if(d.editEnt){const[k,id]=d.editEnt.split(":");entityForm(k,+id);return}
  if(d.toggleEnt){const[k,id]=d.toggleEnt.split(":");const x=db[ENT[k].col].find(y=>y.id===+id);x.active=!x.active;if(k==="users"&&x.id===me().id&&!x.active){x.active=true;return toast("आप अपना ही खाता बंद नहीं कर सकते।","bad")}logAct(`${ENT[k].one}: “${short(x.name||x.title||x.text,40)}” ${x.active?"चालू":"बंद"} किया`);save();render();toast(x.active?"चालू कर दिया गया।":"बंद कर दिया गया।");return}
  if(d.delEnt){const[k,id]=d.delEnt.split(":");const E=ENT[k],x=db[E.col].find(y=>y.id===+id);const block=E.canDelete&&E.canDelete(x);if(block)return toast(block,"bad");confirmBox(`“${esc(short(x.name||x.title||x.text,60))}” हमेशा के लिए हट जाएगा।`,()=>{db[E.col]=db[E.col].filter(y=>y!==x);if(E.sortable)db[E.col].sort((a,b)=>a.order-b.order).forEach((y,i)=>y.order=i+1);logAct(`${E.one}: “${short(x.name||x.title||x.text,40)}” हटाया`);save();render();toast("हटा दिया गया।")});return}
  if(d.move){const[k,id,dir]=d.move.split(":");const L=db[ENT[k].col].sort((a,b)=>a.order-b.order);const i=L.findIndex(y=>y.id===+id),j=i+ +dir;if(j<0||j>=L.length)return;[L[i].order,L[j].order]=[L[j].order,L[i].order];save();render();return}
  if(d.rmTmp){formTmp[d.rmTmp]="";const b=$("#e_"+d.rmTmp+"_box");b.innerHTML=imgBox(d.rmTmp);return}
  if(d.rmTmps){const[k,i]=d.rmTmps.split(":");formTmp[k].splice(+i,1);$("#e_"+k+"_box").innerHTML=imgsBox(k);return}
  if(d.delmedia){confirmBox("यह तस्वीर मीडिया लाइब्रेरी से हट जाएगी। जिन ख़बरों में लगी है, वहाँ बनी रहेगी।",()=>{db.media=db.media.filter(m=>m.id!==+d.delmedia);save();render();toast("तस्वीर हटा दी गई।")});return}
  if(d.untag!==undefined){readEditor();draft.tags.splice(+d.untag,1);render();return}
  if(d.cmd){e.preventDefault();$("#f_content").focus();if(d.cmd==="createLink"){modal({title:"लिंक जोड़ें",body:`<div class="fld"><label for="lnk">वेब पता</label><input id="lnk" class="inp" type="url" placeholder="https://"></div><p class="small muted">पहले ख़बर में शब्द चुनें, फिर लिंक जोड़ें।</p>`,foot:`<button class="btn" data-close>रद्द करें</button><button class="btn primary" id="lnkOk">जोड़ें</button>`,onMount:o=>{const sel=window.getSelection(),range=sel.rangeCount?sel.getRangeAt(0).cloneRange():null;o.querySelector("#lnkOk").onclick=()=>{const u=o.querySelector("#lnk").value.trim();closeModal();if(!/^https?:\/\//.test(u))return toast("लिंक https:// से शुरू होना चाहिए।","bad");$("#f_content").focus();if(range){sel.removeAllRanges();sel.addRange(range)}document.execCommand("createLink",false,u)}}});return}document.execCommand(d.cmd,false,d.val||null);return}
  const act=d.act;
  if(act==="menu"){$("#side").classList.toggle("open");return}
  if(act==="theme"){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";return}
  if(act==="reset"){confirmBox("आपके सारे बदलाव मिट जाएँगे और नमूना डेटा फिर से लोड होगा।",()=>{db=seed();save();draft=null;setSession({userId:1});S.page="dashboard";render();toast("नमूना डेटा दोबारा लोड हो गया।")},"हाँ, रीसेट करें");return}
  if(act==="preview"){readEditor();previewArticle(draft);return}
  if(act==="rmimg"){readEditor();draft.image="";render();return}
  if(act==="pickmedia"){modal({title:"मीडिया लाइब्रेरी से चुनें",wide:true,body:`<div class="gallery-grid">${db.media.map(m=>`<button class="media" style="padding:0;text-align:left" data-pick="${m.id}"><img src="${m.src}" alt="${esc(m.name)}"><div class="cap">${esc(short(m.name,18))}</div></button>`).join("")}</div>`});return}
  if(d.pick){readEditor();draft.image=db.media.find(m=>m.id===+d.pick).src;closeModal();render();return}
  if(act==="notif"){const c=db.comments.filter(x=>x.status==="pending"),s=db.articles.filter(a=>a.status==="scheduled");modal({title:"सूचनाएँ",body:`<ul class="mini-list">${c.map(x=>`<li>${ic("chat")}<div class="t"><b>${esc(x.name)} ने टिप्पणी की</b><span class="small muted">${esc(short(x.text,60))}</span></div><time class="small muted">${ago(x.date)}</time></li>`).join("")}${s.map(a=>`<li>${ic("bolt")}<div class="t"><b>शेड्यूल: ${esc(short(a.title,50))}</b><span class="small muted">${fmtDate(a.date)} पर प्रकाशित होगी</span></div></li>`).join("")}</ul>${!c.length&&!s.length?'<div class="empty">कोई नई सूचना नहीं है।</div>':""}`,foot:c.length?`<button class="btn primary" data-go="comments" data-close>टिप्पणियाँ देखें</button>`:""});return}
  if(act==="profile"){const u=me();modal({title:"मेरी प्रोफ़ाइल",body:`<div style="display:flex;gap:12px;align-items:center"><span class="avatar" style="background:${hue(u.name)};width:48px;height:48px;font-size:20px">${esc(initials(u.name))}</span><div><b style="font-size:17px">${esc(u.name)}</b><div class="muted">${esc(u.email)} · ${ROLES[u.role]}</div></div></div><p class="small muted">अलग रोल देखने के लिए लॉगआउट करके संपादक या रिपोर्टर खाते से लॉगिन करें।</p>`,foot:`<button class="btn danger" data-act="logout">${ic("logout")}लॉगआउट</button>`});return}
  if(act==="logout"){closeModal();setSession({userId:session.userId,out:true});render();return}
  if(t.id==="selAll"){return}
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.dataset.sel){const id=+t.dataset.sel;t.checked?S.sel.add(id):S.sel.delete(id);render();return}
  if(t.id==="selAll"){const per=Number(db.settings.perPage)||10;filteredArticles().slice((S.pg-1)*per,S.pg*per).forEach(a=>t.checked?S.sel.add(a.id):S.sel.delete(a.id));render();return}
  if(t.id==="fcat"){S.fcat=t.value;S.pg=1;render();return}
  if(t.id==="fsort"){S.sort=t.value;render();return}
  if(t.dataset.upTmp){const k=t.dataset.upTmp;try{formTmp[k]=await readImage(t.files[0]);addMedia(formTmp[k],t.files[0].name);save();const b=$("#e_"+k+"_box");b&&(b.innerHTML=imgBox(k))}catch(err){toast(err.message,"bad")}return}
  if(t.dataset.upTmps){const k=t.dataset.upTmps;for(const f of t.files){try{const s=await readImage(f);formTmp[k].push(s);addMedia(s,f.name)}catch(err){toast(err.message,"bad")}}save();$("#e_"+k+"_box").innerHTML=imgsBox(k);return}
  if(t.id==="mUp"){let n=0;for(const f of t.files){try{addMedia(await readImage(f),f.name);n++}catch(err){toast(err.message,"bad")}}if(n){logAct(`${n} तस्वीरें अपलोड कीं`);save();render();toast(`${n} तस्वीरें अपलोड हो गईं।`)}return}
});
let qTimer;
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="aq"){clearTimeout(qTimer);qTimer=setTimeout(()=>{S.q=t.value;S.pg=1;const pos=t.selectionStart;render();const n=$("#aq");n.focus();n.setSelectionRange(pos,pos)},250)}
  if(t.id==="eq"){clearTimeout(qTimer);qTimer=setTimeout(()=>{S.eq=t.value;const pos=t.selectionStart;render();const n=$("#eq");n.focus();n.setSelectionRange(pos,pos)},250)}
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="gsearch"){S.q=$("#gq").value.trim();S.fstatus="";S.fcat="";S.pg=1;go("articles");return}
  if(f.id==="artForm"){saveArticle();return}
  if(f.id==="setForm"){const s=db.settings;["siteName","tagline","email","phone","address","facebook","x","youtube","instagram","color","tickerSpeed"].forEach(k=>s[k]=$("#s_"+k).value.trim());s.perPage=+$("#s_perPage").value;s.comments=$("#s_comments").checked;s.moderate=$("#s_moderate").checked;s.logo=formTmp.logo||"";logAct("साइट सेटिंग बदली");save();toast("सेटिंग सेव हो गई।");return}
  if(f.id==="loginForm"){const em=$("#l_email").value.trim().toLowerCase(),pw=$("#l_pass").value;const u=db.users.find(x=>x.email.toLowerCase()===em);
    if(!u||u.password!==pw){setSession({...session,err:"ईमेल या पासवर्ड ग़लत है। नीचे दिए डेमो खाते आज़माएँ."});render();return}
    if(!u.active){setSession({...session,err:"यह खाता बंद है। एडमिन से संपर्क करें।"});render();return}
    setSession({userId:u.id});S.page="dashboard";S.sel=new Set();render();toast(`स्वागत है, ${u.name}!`);return}
});
document.addEventListener("click",e=>{if(e.target.closest("[data-save]")){saveArticle(e.target.closest("[data-save]").dataset.save)}});
document.addEventListener("click",e=>{if(e.target.closest("[data-go]")&&e.target.closest("#overlay"))closeModal()},true);
document.addEventListener("keydown",e=>{if(e.target.id==="aq"||e.target.id==="eq"){if(e.key==="Enter")e.preventDefault()}});

/* ग्राफ़ टूलटिप */
document.addEventListener("mouseover",e=>{const h=e.target.closest(".chart .hit");const ch=$("#viewsChart");if(!ch)return;const tip=ch.querySelector(".tip");
  if(!h){tip.hidden=true;return}const svg=ch.querySelector("svg"),k=svg.clientWidth/640;tip.textContent=h.dataset.tip;tip.style.left=(+h.dataset.x*k)+"px";tip.style.top=(+h.dataset.y*k)+"px";tip.hidden=false});

/* शुरू */
load();
const hp=location.hash.slice(1);if(hp&&(PAGES[hp]||ENT[hp]))S.page=hp;
if(!can(S.page))S.page="dashboard";
render();
</script>
</html>
